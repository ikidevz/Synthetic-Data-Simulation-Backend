services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synthetic
      POSTGRES_PASSWORD: synthetic_pass
      POSTGRES_DB: synthetic
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthetic"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synthetic_test
      POSTGRES_PASSWORD: synthetic_test_pass
      POSTGRES_DB: synthetic_test
    ports:
      - "5433:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthetic"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://synthetic:synthetic_pass@db:5432/synthetic
      TEST_DATABASE_URL: postgresql+psycopg2://synthetic_test:synthetic_test_pass@db_test:5432/synthetic_test
      API_KEY: ${API_KEY:?set API_KEY in your .env file (python -m app.cli genkey)}
      REQUIRE_API_KEY: "true"
      ENABLE_DOCS: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy

volumes:
  db_data:
  db_test_data:
  pgadmin_data:
